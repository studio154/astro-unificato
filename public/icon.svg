<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Sfondo del quadratino con angoli arrotondati -->
  <rect width="512" height="512" rx="96" fill="#525252" />
  
  <!-- Obiettivo / Diaframma stilizzato centrato ed ingrandito per la favicon -->
  <g transform="translate(64, 64) scale(10)">
    <!-- Anello esterno dell'ottica -->
    <circle cx="20" cy="20" r="12" fill="none" stroke="#f2f1e9" stroke-width="2.5" opacity="0.9"/>
    <!-- Lente centrale / Punto focale -->
    <circle cx="20" cy="20" r="4" fill="#f2f1e9" />
    <!-- Accenti geometrici (lamelle) -->
    <line x1="20" y1="5" x2="20" y2="9" stroke="#525252" stroke-width="2" stroke-linecap="round"/>
    <line x1="20" y1="31" x2="20" y2="35" stroke="#525252" stroke-width="2" stroke-linecap="round"/>
    <line x1="5" y1="20" x2="9" y2="20" stroke="#525252" stroke-width="2" stroke-linecap="round"/>
    <line x1="31" y1="20" x2="35" y2="20" stroke="#525252" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
